name: Build Wolvic APK

on:
  push:
    branches: [ nixify ]
  pull_request:
    branches: [ nixify ]
  workflow_dispatch:

  workflow_call:
    inputs:
      flavour:
        description: "Gradle assemble task flavour (e.g. assembleNoapiArm64GeckoGenericDebug)"
        required: false
        type: string
        default: "assembleNoapiArm64GeckoGenericDebug"
      internal:
        description: "Whether this is an internal build (has access to third-party SDKs)"
        required: false
        type: boolean
        default: false
    secrets:
      THIRD_PARTY_PAT:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ (inputs.internal == true && secrets.THIRD_PARTY_PAT != '') && secrets.THIRD_PARTY_PAT || github.token }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Check flake evaluates
        run: nix flake check

      - name: Build internal flavour with Gradle
        if: ${{ inputs.internal == true && inputs.flavour != '' }}
        run: |
          nix develop --command bash -c "
            git submodule update --init --recursive
            ./gradlew app:${{ inputs.flavour }} \
              -Dfile.encoding=utf-8 \
              -Dorg.gradle.configuration-cache=false \
              --stacktrace
          "

      - name: Upload internal APK
        if: ${{ inputs.internal == true && inputs.flavour != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wolvic-${{ inputs.flavour }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30


      - name: Check deps.json is populated
        if: ${{ inputs.internal != true }}
        run: |
          DEPS=nix/wolvic/deps.json
          if [ ! -f "$DEPS" ]; then
            echo "ERROR: $DEPS does not exist."
            echo "Run the 'Update Gradle deps.json' workflow first."
            exit 1
          fi
          SIZE=$(wc -c < "$DEPS")
          if [ "$SIZE" -lt 100 ]; then
            echo "ERROR: $DEPS is too small ($SIZE bytes) — not yet populated."
            echo "Run the 'Update Gradle deps.json' workflow first, then re-run this build."
            exit 1
          fi
          echo "✓ deps.json is populated ($SIZE bytes)"

      - name: Build Wolvic APK with Nix
        if: ${{ inputs.internal != true }}
        run: nix build .#wolvic-apk --print-build-logs

      - name: Verify APK exists
        if: ${{ inputs.internal != true }}
        run: |
          if ! ls result/*.apk &>/dev/null; then
            echo "ERROR: No APK found in result/"
            exit 1
          fi
          echo "=== Built APK(s) ==="
          ls -lh result/*.apk
          echo ""
          echo "=== SHA-256 checksums ==="
          sha256sum result/*.apk

      - name: Upload Nix-built APK
        if: ${{ inputs.internal != true }}
        uses: actions/upload-artifact@v4
        with:
          name: wolvic-noapi-debug
          path: result/*.apk
          retention-days: 30

      - name: Verify reproducibility
        if: ${{ inputs.internal != true }}
        run: |
          echo "Building a second time with --rebuild..."
          nix build .#wolvic-apk --rebuild --out-link result2 --print-build-logs

          echo ""
          echo "=== Reproducibility check ==="
          HASH1=$(sha256sum result/*.apk  | awk '{print $1}')
          HASH2=$(sha256sum result2/*.apk | awk '{print $1}')
          echo "Build 1: $HASH1"
          echo "Build 2: $HASH2"

          if [ "$HASH1" = "$HASH2" ]; then
            echo ""
            echo "✓ SUCCESS — both builds are byte-for-byte identical."
            echo "  This APK is reproducible."
          else
            echo ""
            echo "✗ FAIL — the two builds differ."
            echo "  Check for timestamps, random salts, or non-deterministic ordering."
            exit 1
          fi