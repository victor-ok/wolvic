name: Build Wolvic APK

on:
  push:
    branches: [ nixify ]
  pull_request:
    branches: [ nixify ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Check flake
        run: nix flake check

      - name: Build Wolvic APK
        run: nix build .#wolvic-apk --print-build-logs

      - name: Verify APK exists
        run: |
          ls -lh result/*.apk
          echo "APK sha256: $(sha256sum result/*.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolvic-noapi-debug
          path: result/*.apk
          retention-days: 30

      - name: Build again to verify reproducibility
        run: |
          nix build .#wolvic-apk --rebuild --out-link result2
          echo "=== Reproducibility check ==="
          HASH1=$(sha256sum result/*.apk  | awk '{print $1}')
          HASH2=$(sha256sum result2/*.apk | awk '{print $1}')
          echo "Build 1: $HASH1"
          echo "Build 2: $HASH2"
          if [ "$HASH1" = "$HASH2" ]; then
            echo "✓ Builds are identical — reproducible!"
          else
            echo "✗ FAIL: builds differ — not reproducible"
            exit 1
          fi